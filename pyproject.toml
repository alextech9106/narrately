[project]
name = "text-to-audio"
version = "0.1.0"
description = "Convert a web article into a spoken mp3 file from its URL"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alex Brito de las Cuevas", email = "alextech9106@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gtts>=2.5.4",
    "lxml-html-clean>=0.4.5",
    "newspaper3k>=0.2.8",
    "nltk>=3.10.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]
keywords = ["tts", "text-to-speech", "web-scraping", "newspaper", "gtts", "mp3"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/alextech9106/text-to-audio"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[[tool.mypy.overrides]]
module = ["gtts.*", "newspaper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
