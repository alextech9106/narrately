[project]
name = "text-to-voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alextech9106", email = "alextech9106@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gtts>=2.5.4",
    "lxml-html-clean>=0.4.5",
    "newspaper3k>=0.2.8",
    "nltk>=3.10.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
text-to-voice = "text_to_voice:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
